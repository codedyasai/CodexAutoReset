name: Build and test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.423

      - name: Restore locked dependencies
        run: dotnet restore CodexResetGuard.sln --locked-mode

      - name: Build
        run: dotnet build CodexResetGuard.sln -c Release --no-restore

      - name: Test
        run: dotnet test CodexResetGuard.sln -c Release --no-build

      - name: Verify formatting
        run: dotnet format CodexResetGuard.sln --no-restore --verify-no-changes

name: Build Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag points to main
        shell: pwsh
        run: |
          git fetch --no-tags origin `
            +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Fetching the main branch failed."
          }
          git merge-base --is-ancestor $env:GITHUB_SHA `
            refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "The release tag must point to a commit on main."
          }

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.423

      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $expected = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          $download = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri $url -OutFile $download
          $actual = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Inno Setup checksum mismatch."
          }
          $process = Start-Process -FilePath $download `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }

      - name: Build, test, and package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH."
          }
          $version = $Matches.version
          .\scripts\build-release.ps1 -Version $version

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Windows에서 처음 사용하는 경우 `CodexAutoReset-Setup-x64.exe`를 다운로드해 실행하세요.

          앱이 트레이에서 실행 중일 때 실행 파일이나 바로가기를 다시 열면 경고창 대신 기존 창이 바로 나타납니다. 별도의 감시 프로세스나 트레이 아이콘은 추가되지 않습니다.

          앱이 종료되는 순간과 재실행이 겹쳐도 기존 창 연결 또는 새 실행을 안전하게 재시도합니다. Windows 로그인에 따른 백그라운드 중복 실행은 창을 갑자기 열지 않고 조용히 종료됩니다.

          기존 주간·5시간 한도 확인, 초기화권 자동 사용, 사용량 초기화 팝업, 창 고정과 안전 장치는 그대로 유지됩니다. 사용자 설정이나 중복 사용 방지 기록의 저장 형식도 바뀌지 않습니다.

          설치 프로그램은 관리자 권한을 요구하지 않으며 .NET 런타임을 포함합니다. 유료 코드 서명을 사용하지 않으므로 Windows SmartScreen에서 `알 수 없는 게시자` 경고가 표시될 수 있습니다. 이 저장소의 Release에서 받은 파일인지 확인한 뒤 진행하세요.

          기존 사용자는 트레이 메뉴에서 앱을 완전히 종료한 뒤 새 설치 파일을 실행하세요. 기존 임계값, 켜짐·꺼짐 상태와 중복 사용 방지 기록은 그대로 유지됩니다.

          설치하지 않고 사용하려면 `CodexAutoReset-Portable-x64.zip`을 내려받아 압축을 완전히 푼 다음 `CodexAutoReset.exe`를 실행하세요.
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          [System.IO.File]::WriteAllText(
            $notesPath,
            $notes,
            [System.Text.UTF8Encoding]::new($false))
          $assets = @(
            ".\artifacts\release\CodexAutoReset-Setup-x64.exe",
            ".\artifacts\release\CodexAutoReset-Portable-x64.zip"
          )
          gh release view $env:GITHUB_REF_NAME 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Refusing to overwrite an existing GitHub release."
          }
          gh release create $env:GITHUB_REF_NAME @assets `
            --verify-tag `
            --title "CodexAutoReset $env:GITHUB_REF_NAME" `
            --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed."
          }
